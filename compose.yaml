# A local PostgreSQL 16 with pgvector for development and tests. Start it with:
#   docker compose up -d db
# It listens on 127.0.0.1:5433 so it does not clash with a Postgres already on 5432.
# The data lives in a named volume. `docker compose down -v` throws it away.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - energyops-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  energyops-db:
